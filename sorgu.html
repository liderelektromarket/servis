<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servis Takip — Lider Elektromarket</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0E1A2B;--org:#F26522;--wa:#25D366;--bg:#F3F5F8;--mut:#6B7A8F;--bd:#DCE2EA;--grn:#16a34a;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--navy);font-size:16px}
header{background:var(--navy);padding:14px 16px;display:flex;align-items:center;gap:12px}
header .logo{background:#fff;border-radius:8px;padding:6px 10px}header .logo img{height:32px;display:block}
header div.t{color:#fff;font-weight:700;font-size:15px}header div.t small{display:block;color:#9FB0C4;font-weight:400;font-size:12px}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:12px}
.fis{font-size:13px;color:var(--mut);letter-spacing:.5px}
.no{font-size:26px;font-weight:800;color:var(--navy)}
.cihaz{font-size:17px;font-weight:600;margin-top:4px}
.badge{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:12px;color:#fff;font-weight:800;font-size:18px;width:100%;text-align:center}
.steps{display:flex;gap:4px;margin-top:14px}
.steps div{flex:1;height:8px;border-radius:4px;background:#E6EBF1}.steps div.on{background:var(--grn)}.steps div.cur{background:var(--org)}
.sl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:15px}
.row:last-child{border:0}.row span:first-child{color:var(--mut)}.row span:last-child{font-weight:600;text-align:right}
.box{border-radius:12px;padding:14px;margin-top:12px;font-size:15px;line-height:1.45}
.box.o{background:#fff3e8;border:1px solid #f7c9a8}.box.g{background:#e8f7ee;border:1px solid #b7e4c7}.box.r{background:#fee2e2;border:1px solid #fca5a5}.box.b{background:#eef2f7;border:1px solid var(--bd)}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--wa);text-align:center;text-decoration:none;margin-top:10px;cursor:pointer}
.btn.lt{background:#E6EBF1;color:var(--navy)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px;line-height:1.6}
.foot a{color:var(--mut)}
.err{text-align:center;padding:40px 10px;color:var(--mut)}
</style>
</head>

 else if(d.durum==='teslim'){const gl=(d.garanti||[]).filter(g=>g.ay>0);boxes+=`<div class="box g"><b>Teslim edildi: ${fmtDay(d.teslimTarihi)}</b>${gl.length?'<br>🛡 Garanti: '+gl.map(g=>esc(g.kapsam)+' — '+SURE[g.ay]+' ('+fmtDay(g.bitis)+' tarihine kadar)').join('<br>'):''}<br>Bizi tercih ettiğiniz için teşekkür ederiz.</div>`}
