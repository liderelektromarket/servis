<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lider Teknik Servis</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--txt:#111827;--mut:#6b7280;--bd:#e5e7eb;--pri:#1d4ed8;--pri2:#1e40af;--red:#dc2626;--grn:#16a34a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{background:#111827;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;flex:1;min-width:180px}
header h1 small{display:block;font-size:12px;color:#9ca3af;font-weight:400}
.btn{border:0;border-radius:8px;padding:10px 14px;font-size:14px;cursor:pointer;background:#374151;color:#fff;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pri)}.btn.pri:hover{background:var(--pri2)}
.btn.red{background:var(--red)}.btn.grn{background:var(--grn)}.btn.lt{background:#e5e7eb;color:#111}
.btn.sm{padding:6px 10px;font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:10px;padding:10px;cursor:pointer;border:1px solid var(--bd);border-left:5px solid #999}
.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--mut)}
.stat.on{outline:2px solid var(--pri)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input,.tools select{padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;background:#fff}
.tools input{flex:1;min-width:200px}
.list{display:grid;gap:8px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:110px 1.4fr 1.4fr 1fr auto;gap:10px;align-items:center;cursor:pointer}
.row:hover{border-color:var(--pri)}
.row .fis{font-weight:700;color:var(--pri)}.row .fis small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.row .m b{display:block}.row .m span{color:var(--mut);font-size:13px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}
.money{text-align:right;font-weight:600}.money small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.empty{text-align:center;color:var(--mut);padding:40px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 10px;overflow:auto;z-index:50}
.ov.show{display:flex}
.md{background:#fff;border-radius:14px;width:100%;max-width:820px;padding:18px}
.md h2{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.md h2 .x{margin-left:auto;background:none;border:0;font-size:24px;cursor:pointer;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px}.f.w{grid-column:1/-1}
label{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase}
input,select,textarea{padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;font-family:inherit;width:100%}
textarea{min-height:64px;resize:vertical}
.sec{margin:14px 0 6px;font-weight:700;color:var(--pri);border-bottom:2px solid var(--bd);padding-bottom:4px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:5px;background:#f3f4f6;padding:7px 10px;border-radius:8px;text-transform:none;font-size:14px;color:#111;cursor:pointer}
.chk input{width:auto}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:flex-end}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}
.kv div{padding:6px 0;border-bottom:1px dashed var(--bd)}.kv label{display:block}
.statusbtns{display:flex;flex-wrap:wrap;gap:6px}
.statusbtns button{border:2px solid transparent;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;opacity:.75}
.statusbtns button.on{opacity:1;border-color:#111;transform:scale(1.04)}
.hist{font-size:13px;color:var(--mut);max-height:160px;overflow:auto;background:#f9fafb;padding:8px;border-radius:8px}
.hist div{padding:3px 0}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px;margin:4px 0;font-size:14px}
.note small{color:var(--mut);display:block;font-size:11px}
.addnote{display:flex;gap:6px;margin-top:6px}
#login{position:fixed;inset:0;background:#111827;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#login .box{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:380px}
#login h1{margin:0 0 4px;font-size:22px}#login p{margin:0 0 18px;color:var(--mut)}
#login .f{margin-bottom:12px}#login .err{color:var(--red);font-size:13px;min-height:18px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:200}
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block;font-family:Arial,sans-serif;font-size:12px;color:#000;padding:10mm}
 #print h2{margin:0;font-size:18px}
 #print .pt{display:flex;justify-content:space-between;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
 #print table{width:100%;border-collapse:collapse;margin:6px 0}
 #print td{border:1px solid #000;padding:5px;vertical-align:top}
 #print td:first-child{width:28%;font-weight:bold;background:#eee}
 #print .sig{display:flex;justify-content:space-between;margin-top:30px}
 #print .sig div{width:45%;border-top:1px solid #000;padding-top:4px;text-align:center}
 #print .kosul{font-size:10px;margin-top:10px;border:1px solid #000;padding:6px}
}
@media(max-width:700px){
 .row{grid-template-columns:1fr 1fr;padding:10px}
 .row .money{text-align:left}
 .row .fis{grid-column:1/-1}
 header .btn{padding:8px 10px;font-size:13px}
}
</style>
</head>
<body>

<div id="login"><div class="box">
 <h1>LİDER TEKNİK SERVİS</h1><p>Giriş yap</p>
 <div class="f"><label>E-posta</label><input id="lEmail" type="email" autocomplete="username"></div>
 <div class="f"><label>Şifre</label><input id="lPass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
 <div class="err" id="lErr"></div>
 <button class="btn pri" style="width:100%" onclick="login()">Giriş</button>
</div></div>

<header>
 <h1>LİDER TEKNİK SERVİS<small id="who">Servis Takip Sistemi</small></h1>
 <button class="btn pri" onclick="openForm()">＋ Yeni Kayıt</button>
 <button class="btn" onclick="openSettings()">⚙ Ayarlar</button>
 <button class="btn" onclick="backup()">⬇ Yedek</button>
 <button class="btn lt sm" onclick="logout()">Çıkış</button>
</header>

<div class="wrap">
 <div class="stats" id="stats"></div>
 <div class="tools">
  <input id="q" placeholder="Ara: müşteri adı, telefon, fiş no, marka..." oninput="render()">
  <select id="fType" onchange="render()">
   <option value="">Tüm Cihazlar</option>
   <option>Televizyon</option><option>Laptop</option><option>Masaüstü Bilgisayar</option><option>Telefon</option><option>Diğer</option>
  </select>
  <select id="fShow" onchange="render()">
   <option value="acik">Açık İşler</option>
   <option value="hepsi">Hepsi</option>
   <option value="kapali">Teslim Edilen / Kapanan</option>
  </select>
 </div>
 <div class="list" id="list"></div>
</div>

<div class="ov" id="formOv"><div class="md">
 <h2><span id="formTitle">Yeni Servis Kaydı</span><button class="x" onclick="closeAll()">×</button></h2>
 <input type="hidden" id="editId">
 <div class="sec">Müşteri</div>
 <div class="g">
  <div class="f"><label>Ad Soyad *</label><input id="musteri"></div>
  <div class="f"><label>Telefon *</label><input id="tel" type="tel"></div>
  <div class="f"><label>Teslim Şekli</label><select id="teslimSekli" onchange="toggleAdres()"><option>Müşteri Getirdi</option><option>Adresten Alındı</option></select></div>
  <div class="f w" id="adresF" style="display:none"><label>Adres</label><input id="adres"></div>
 </div>
 <div class="sec">Cihaz</div>
 <div class="g">
  <div class="f"><label>Cihaz Tipi</label><select id="cihazTipi" onchange="toggleSifre()"><option>Televizyon</option><option>Laptop</option><option>Masaüstü Bilgisayar</option><option>Telefon</option><option>Diğer</option></select></div>
  <div class="f"><label>Marka</label><input id="marka"></div>
  <div class="f"><label>Model</label><input id="model"></div>
  <div class="f"><label>Seri No</label><input id="seri"></div>
  <div class="f" id="sifreF" style="display:none"><label>Cihaz / Kullanıcı Şifresi</label><input id="sifre"></div>
  <div class="f w"><label>Arıza Şikayeti *</label><textarea id="ariza"></textarea></div>
  <div class="f w"><label>Fiziksel Durum (çizik, kırık, eksik parça vb.)</label><input id="fiziksel"></div>
 </div>
 <div class="sec">Yanında Getirilen Aksesuarlar</div>
 <div class="chk" id="aks">
  <label><input type="checkbox" value="Kumanda">Kumanda</label>
  <label><input type="checkbox" value="Ayak/Stand">Ayak/Stand</label>
  <label><input type="checkbox" value="Güç Kablosu">Güç Kablosu</label>
  <label><input type="checkbox" value="Duvar Askısı">Duvar Askısı</label>
  <label><input type="checkbox" value="Vidalar">Vidalar</label>
  <label><input type="checkbox" value="Şarj Adaptörü">Şarj Adaptörü</label>
  <label><input type="checkbox" value="Çanta">Çanta</label>
  <label><input type="checkbox" value="Mouse">Mouse</label>
  <label><input type="checkbox" value="Klavye">Klavye</label>
  <label><input type="checkbox" value="Kutu">Kutu</label>
 </div>
 <div class="f" style="margin-top:8px"><label>Diğer Aksesuar</label><input id="aksDiger"></div>
 <div class="sec">Ücret</div>
 <div class="g">
  <div class="f"><label>Tahmini Ücret (₺)</label><input id="tahmini" type="number"></div>
  <div class="f"><label>Alınan Kapora (₺)</label><input id="kapora" type="number"></div>
  <div class="f"><label>Teslim Alan Personel</label><input id="alan"></div>
 </div>
 <div class="acts">
  <button class="btn lt" onclick="closeAll()">Vazgeç</button>
  <button class="btn pri" id="saveBtn" onclick="save()">Kaydet</button>
 </div>
</div></div>

<div class="ov" id="detOv"><div class="md" id="det"></div></div>

<div class="ov" id="setOv"><div class="md">
 <h2>Ayarlar (Fişte Görünür)<button class="x" onclick="closeAll()">×</button></h2>
 <div class="g">
  <div class="f w"><label>Firma Adı</label><input id="sFirma"></div>
  <div class="f w"><label>Adres</label><input id="sAdres"></div>
  <div class="f"><label>Telefon</label><input id="sTel"></div>
  <div class="f"><label>Fiş No Öneki</label><input id="sPrefix"></div>
  <div class="f w"><label>Fiş Alt Notu / Koşullar</label><textarea id="sKosul"></textarea></div>
 </div>
 <div class="acts"><button class="btn pri" onclick="saveSettings()">Kaydet</button></div>
</div></div>

<div id="toast"></div>
<div id="print"></div>

<script>
const SB_URL='https://qjoebrjndnsfxxrcfcvk.supabase.co';
const SB_KEY='sb_publishable_QiC5qTT7N1UfIgg_b5QPog_d99YU-Bv';
const sb=supabase.createClient(SB_URL,SB_KEY);

const ST=[
 {k:'bekliyor',n:'Tezgaha Alınmadı',c:'#6b7280'},
 {k:'tezgah',n:'Tezgahta / İnceleniyor',c:'#2563eb'},
 {k:'parca',n:'Parça Bekliyor',c:'#ea580c'},
 {k:'onay',n:'Müşteri Onayı Bekliyor',c:'#7c3aed'},
 {k:'hazir',n:'Tamamlandı - Teslime Hazır',c:'#16a34a'},
 {k:'teslim',n:'Teslim Edildi',c:'#065f46'},
 {k:'iade',n:'Yapılamadı / İade',c:'#dc2626'}
];
const stOf=k=>ST.find(s=>s.k===k)||ST[0];
const KAPALI=['teslim','iade'];
const DEF_CFG={firma:'LİDER ELEKTROMARKET',adres:'Esenşehir Mah. Özerk Sok. No: 4/A Ümraniye/İstanbul',tel:'0216 415 51 61',prefix:'LDR',kosul:'Cihazınızı teslim alırken bu fişi getiriniz. Arıza tespiti sonrası ücret bilgisi telefonla verilir, onay alınmadan işlem yapılmaz. Veri kaybından firmamız sorumlu değildir; önemli verilerinizi yedekleyiniz. 30 gün içinde teslim alınmayan cihazlardan firmamız sorumlu değildir.'};
let data=[],cfg={...DEF_CFG},filterSt='',me='';
const $=id=>document.getElementById(id);
const fmtD=t=>new Date(t).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtDay=t=>new Date(t).toLocaleDateString('tr-TR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Number(v)||0;
function toast(m,err){const t=$('toast');t.textContent=m;t.style.background=err?'#dc2626':'#111';t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function closeAll(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'))}
function toggleAdres(){$('adresF').style.display=$('teslimSekli').value==='Adresten Alındı'?'':'none'}
function toggleSifre(){const t=$('cihazTipi').value;$('sifreF').style.display=(t==='Laptop'||t==='Masaüstü Bilgisayar'||t==='Telefon')?'':'none'}

/* ---------- AUTH ---------- */
async function login(){
 $('lErr').textContent='';
 const {error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});
 if(error){$('lErr').textContent='E-posta veya şifre hatalı.';return}
}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.onAuthStateChange((ev,session)=>{
 if(session){me=session.user.email;$('login').style.display='none';$('who').textContent=me;start()}
 else{$('login').style.display='flex'}
});

/* ---------- DATA ---------- */
let started=false;
async function start(){
 if(started)return;started=true;
 await loadCfg();await loadAll();
 sb.channel('kayitlar').on('postgres_changes',{event:'*',schema:'public',table:'kayitlar'},()=>loadAll()).subscribe();
}
async function loadCfg(){
 const {data:d}=await sb.from('ayarlar').select('veri').eq('id',1).maybeSingle();
 if(d)cfg={...DEF_CFG,...d.veri};
}
async function loadAll(){
 const {data:rows,error}=await sb.from('kayitlar').select('id,veri').order('tarih',{ascending:false});
 if(error){toast('Veri alınamadı: '+error.message,1);return}
 data=rows.map(x=>({...x.veri,id:x.id}));
 render();
 if($('detOv').classList.contains('show')&&curDet)openDet(curDet);
}
async function dbSave(r){
 const row={fis_no:r.fisNo,tarih:new Date(r.tarih).toISOString(),durum:r.durum,veri:r,guncelleme:new Date().toISOString()};
 if(r.id)row.id=r.id;
 const {data:d,error}=await sb.from('kayitlar').upsert(row).select('id').single();
 if(error){toast('Kaydedilemedi: '+error.message,1);return false}
 r.id=d.id;return true;
}
async function nextFis(){
 const y=new Date().getFullYear().toString().slice(2);
 const pre=`${cfg.prefix}-${y}-`;
 const {data:rows}=await sb.from('kayitlar').select('fis_no').like('fis_no',pre+'%').order('fis_no',{ascending:false}).limit(1);
 const last=rows&&rows[0]?parseInt(rows[0].fis_no.slice(pre.length))||0:0;
 return pre+String(last+1).padStart(4,'0');
}

/* ---------- FORM ---------- */
function openForm(r){
 closeAll();
 $('formTitle').textContent=r?'Kaydı Düzenle - '+r.fisNo:'Yeni Servis Kaydı';
 $('editId').value=r?r.id:'';
 ['musteri','tel','adres','marka','model','seri','sifre','ariza','fiziksel','aksDiger','tahmini','kapora','alan'].forEach(k=>$(k).value=r?(r[k]??''):'');
 $('teslimSekli').value=r?r.teslimSekli:'Müşteri Getirdi';
 $('cihazTipi').value=r?r.cihazTipi:'Televizyon';
 document.querySelectorAll('#aks input').forEach(c=>c.checked=r?(r.aks||[]).includes(c.value):false);
 toggleAdres();toggleSifre();
 $('formOv').classList.add('show');$('musteri').focus();
}
async function save(){
 const m=$('musteri').value.trim(),t=$('tel').value.trim(),a=$('ariza').value.trim();
 if(!m||!t||!a){alert('Ad Soyad, Telefon ve Arıza zorunlu.');return}
 $('saveBtn').disabled=true;
 const id=$('editId').value;
 let r=id?data.find(x=>x.id==id):{fisNo:await nextFis(),tarih:Date.now(),durum:'bekliyor',notlar:[],gecmis:[{t:Date.now(),d:'bekliyor',u:me}],iscilik:0,parca:0,alinan:0,acan:me};
 Object.assign(r,{musteri:m,tel:t,adres:$('adres').value.trim(),teslimSekli:$('teslimSekli').value,cihazTipi:$('cihazTipi').value,marka:$('marka').value.trim(),model:$('model').value.trim(),seri:$('seri').value.trim(),sifre:$('sifre').value.trim(),ariza:a,fiziksel:$('fiziksel').value.trim(),aksDiger:$('aksDiger').value.trim(),tahmini:num($('tahmini').value),kapora:num($('kapora').value),alan:$('alan').value.trim(),aks:[...document.querySelectorAll('#aks input:checked')].map(c=>c.value)});
 if(!id)r.alinan=r.kapora;
 const ok=await dbSave(r);$('saveBtn').disabled=false;
 if(!ok)return;
 closeAll();await loadAll();toast('Kaydedildi: '+r.fisNo);
 if(!id&&confirm('Kayıt açıldı: '+r.fisNo+'\nTeslim fişi yazdırılsın mı?'))printFis(r.id);
}

/* ---------- LIST ---------- */
function render(){
 const q=$('q').value.toLowerCase(),ft=$('fType').value,sh=$('fShow').value;
 const open=data.filter(r=>!KAPALI.includes(r.durum));
 $('stats').innerHTML=`<div class="stat ${filterSt===''?'on':''}" style="border-left-color:#111" onclick="setSt('')"><b>${open.length}</b><span>Açık İş</span></div>`+
  ST.map(s=>`<div class="stat ${filterSt===s.k?'on':''}" style="border-left-color:${s.c}" onclick="setSt('${s.k}')"><b>${data.filter(r=>r.durum===s.k).length}</b><span>${s.n}</span></div>`).join('');
 let list=data.filter(r=>{
  if(filterSt&&r.durum!==filterSt)return false;
  if(!filterSt){if(sh==='acik'&&KAPALI.includes(r.durum))return false;if(sh==='kapali'&&!KAPALI.includes(r.durum))return false}
  if(ft&&r.cihazTipi!==ft)return false;
  if(q&&![r.musteri,r.tel,r.fisNo,r.marka,r.model,r.seri].join(' ').toLowerCase().includes(q))return false;
  return true;
 });
 $('list').innerHTML=list.length?list.map(r=>{
  const s=stOf(r.durum),top=num(r.iscilik)+num(r.parca)||num(r.tahmini),kal=top-num(r.alinan);
  const gun=Math.floor((Date.now()-r.tarih)/86400000);
  return `<div class="row" onclick="openDet(${r.id})">
   <div class="fis">${r.fisNo}<small>${fmtDay(r.tarih)} · ${gun} gün</small></div>
   <div class="m"><b>${esc(r.musteri)}</b><span>${esc(r.tel)}</span></div>
   <div class="m"><b>${esc(r.cihazTipi)} ${esc(r.marka)} ${esc(r.model)}</b><span>${esc(r.ariza).slice(0,60)}</span></div>
   <div><span class="badge" style="background:${s.c}">${s.n}</span></div>
   <div class="money">${top?top.toLocaleString('tr-TR')+' ₺':'-'}<small>${kal>0?'Kalan: '+kal.toLocaleString('tr-TR')+' ₺':(top?'Ödendi':'')}</small></div>
  </div>`}).join(''):'<div class="empty">Kayıt bulunamadı.</div>';
}
function setSt(k){filterSt=filterSt===k?'':k;render()}

/* ---------- DETAIL ---------- */
let curDet=null;
function openDet(id){
 const r=data.find(x=>x.id==id);if(!r)return;closeAll();curDet=id;
 const s=stOf(r.durum),top=num(r.iscilik)+num(r.parca),kal=top-num(r.alinan);
 $('det').innerHTML=`
 <h2>${r.fisNo} <span class="badge" style="background:${s.c}">${s.n}</span><button class="x" onclick="closeAll()">×</button></h2>
 <div class="sec">Durum Değiştir</div>
 <div class="statusbtns">${ST.map(x=>`<button style="background:${x.c}" class="${x.k===r.durum?'on':''}" onclick="setDurum(${r.id},'${x.k}')">${x.n}</button>`).join('')}</div>
 <div class="sec">Bilgiler</div>
 <div class="kv">
  <div><label>Müşteri</label><b>${esc(r.musteri)}</b></div>
  <div><label>Telefon</label><a href="tel:${esc(r.tel)}">${esc(r.tel)}</a></div>
  <div><label>Teslim Alınma</label>${fmtD(r.tarih)}</div>
  <div><label>Teslim Şekli</label>${esc(r.teslimSekli)}${r.adres?' - '+esc(r.adres):''}</div>
  <div><label>Cihaz</label>${esc(r.cihazTipi)} ${esc(r.marka)} ${esc(r.model)}</div>
  <div><label>Seri No</label>${esc(r.seri)||'-'}</div>
  ${r.sifre?`<div><label>Şifre</label>${esc(r.sifre)}</div>`:''}
  <div><label>Aksesuarlar</label>${esc([...(r.aks||[]),r.aksDiger].filter(Boolean).join(', '))||'Yok'}</div>
  <div><label>Fiziksel Durum</label>${esc(r.fiziksel)||'-'}</div>
  <div><label>Teslim Alan</label>${esc(r.alan)||'-'}</div>
  <div><label>Kaydı Açan</label>${esc(r.acan)||'-'}</div>
  <div style="grid-column:1/-1"><label>Arıza</label>${esc(r.ariza)}</div>
 </div>
 <div class="sec">Ücret</div>
 <div class="g">
  <div class="f"><label>Tahmini (₺)</label><input value="${r.tahmini||''}" disabled></div>
  <div class="f"><label>İşçilik (₺)</label><input type="number" id="dIsc" value="${r.iscilik||''}" onchange="setUcret(${r.id})"></div>
  <div class="f"><label>Parça (₺)</label><input type="number" id="dPar" value="${r.parca||''}" onchange="setUcret(${r.id})"></div>
  <div class="f"><label>Alınan Toplam (₺)</label><input type="number" id="dAl" value="${r.alinan||''}" onchange="setUcret(${r.id})"></div>
 </div>
 <p style="margin:8px 0"><b>Toplam: ${top.toLocaleString('tr-TR')} ₺</b> &nbsp; Kalan: <b style="color:${kal>0?'var(--red)':'var(--grn)'}">${kal.toLocaleString('tr-TR')} ₺</b></p>
 <div class="sec">Teknisyen Notları</div>
 ${(r.notlar||[]).length?r.notlar.slice().reverse().map(n=>`<div class="note">${esc(n.text)}<small>${fmtD(n.t)} · ${esc(n.u||'')}</small></div>`).join(''):'<div style="color:var(--mut);font-size:13px">Not yok.</div>'}
 <div class="addnote"><input id="newNote" placeholder="Not ekle (yapılan işlem, sipariş edilen parça, müşteri araması...)" onkeydown="if(event.key==='Enter')addNote(${r.id})"><button class="btn pri sm" onclick="addNote(${r.id})">Ekle</button></div>
 <div class="sec">Durum Geçmişi</div>
 <div class="hist">${(r.gecmis||[]).slice().reverse().map(g=>`<div>${fmtD(g.t)} — ${stOf(g.d).n} <i>(${esc(g.u||'')})</i></div>`).join('')}</div>
 <div class="acts">
  <button class="btn red sm" onclick="del(${r.id})">Sil</button>
  <button class="btn lt" onclick="openForm(data.find(x=>x.id==${r.id}))">Düzenle</button>
  <button class="btn" onclick="printFis(${r.id})">🖨 Fiş Yazdır</button>
  <button class="btn grn" onclick="waMsg(${r.id})">WhatsApp</button>
 </div>`;
 $('detOv').classList.add('show');
}
async function setDurum(id,k){const r=data.find(x=>x.id==id);if(r.durum===k)return;r.durum=k;r.gecmis.push({t:Date.now(),d:k,u:me});if(k==='teslim')r.teslimTarihi=Date.now();if(await dbSave(r)){toast('Durum: '+stOf(k).n);await loadAll()}}
async function setUcret(id){const r=data.find(x=>x.id==id);r.iscilik=num($('dIsc').value);r.parca=num($('dPar').value);r.alinan=num($('dAl').value);if(await dbSave(r)){await loadAll()}}
async function addNote(id){const v=$('newNote').value.trim();if(!v)return;const r=data.find(x=>x.id==id);r.notlar.push({t:Date.now(),text:v,u:me});if(await dbSave(r))await loadAll()}
async function del(id){if(!confirm('Bu kayıt kalıcı olarak silinecek. Emin misin?'))return;const {error}=await sb.from('kayitlar').delete().eq('id',id);if(error){toast('Silinemedi',1);return}closeAll();await loadAll()}
function waMsg(id){
 const r=data.find(x=>x.id==id),s=stOf(r.durum);
 let tel=r.tel.replace(/\D/g,'');if(tel.startsWith('0'))tel='9'+tel;if(tel.length===10)tel='90'+tel;
 const msg=`Merhaba ${r.musteri}, ${cfg.firma} Teknik Servis. ${r.fisNo} numaralı ${r.cihazTipi} (${r.marka} ${r.model}) cihazınızın durumu: ${s.n}.`;
 window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(msg));
}

/* ---------- PRINT ---------- */
function printFis(id){
 const r=data.find(x=>x.id==id);
 $('print').innerHTML=`
 <div class="pt"><div><h2>${esc(cfg.firma)}</h2>${esc(cfg.adres)}<br>Tel: ${esc(cfg.tel)}</div>
 <div style="text-align:right"><h2>SERVİS TESLİM FİŞİ</h2><b style="font-size:16px">${r.fisNo}</b><br>${fmtD(r.tarih)}</div></div>
 <table>
  <tr><td>Müşteri</td><td>${esc(r.musteri)}</td></tr>
  <tr><td>Telefon</td><td>${esc(r.tel)}</td></tr>
  ${r.adres?`<tr><td>Adres</td><td>${esc(r.adres)}</td></tr>`:''}
  <tr><td>Cihaz</td><td>${esc(r.cihazTipi)} - ${esc(r.marka)} ${esc(r.model)}</td></tr>
  <tr><td>Seri No</td><td>${esc(r.seri)||'-'}</td></tr>
  <tr><td>Aksesuarlar</td><td>${esc([...(r.aks||[]),r.aksDiger].filter(Boolean).join(', '))||'Yok'}</td></tr>
  <tr><td>Fiziksel Durum</td><td>${esc(r.fiziksel)||'-'}</td></tr>
  <tr><td>Arıza Şikayeti</td><td>${esc(r.ariza)}</td></tr>
  <tr><td>Tahmini Ücret</td><td>${r.tahmini?r.tahmini.toLocaleString('tr-TR')+' ₺':'Arıza tespiti sonrası bildirilecek'}</td></tr>
  <tr><td>Alınan Kapora</td><td>${num(r.kapora).toLocaleString('tr-TR')} ₺</td></tr>
  <tr><td>Teslim Alan</td><td>${esc(r.alan)||'-'}</td></tr>
 </table>
 <div class="kosul">${esc(cfg.kosul)}</div>
 <div class="sig"><div>Teslim Eden (Müşteri)<br><br>İmza</div><div>Teslim Alan (${esc(cfg.firma)})<br><br>İmza / Kaşe</div></div>`;
 window.print();
}

/* ---------- SETTINGS / BACKUP ---------- */
function openSettings(){closeAll();$('sFirma').value=cfg.firma;$('sAdres').value=cfg.adres;$('sTel').value=cfg.tel;$('sPrefix').value=cfg.prefix;$('sKosul').value=cfg.kosul;$('setOv').classList.add('show')}
async function saveSettings(){
 cfg={firma:$('sFirma').value,adres:$('sAdres').value,tel:$('sTel').value,prefix:$('sPrefix').value||'LDR',kosul:$('sKosul').value};
 const {error}=await sb.from('ayarlar').upsert({id:1,veri:cfg});
 if(error){toast('Ayar kaydedilemedi',1);return}closeAll();toast('Ayarlar kaydedildi');
}
function backup(){
 const b=new Blob([JSON.stringify({data,cfg},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='servis-yedek-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeAll()}));
</script>
</body>
</html>
